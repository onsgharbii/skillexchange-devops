name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render Kubernetes manifests
        run: kubectl kustomize k8s > /dev/null
      - name: Validate Compose file
        run: cp .env.example .env && docker compose config --quiet

  # Builds the whole stack and checks a real user flow before anything is published.
  smoke-test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up -d --build
      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/skillExchange/posts/retrievePostss || true)
            [ "$code" = 200 ] && exit 0
            sleep 5
          done
          echo "API did not become ready"; exit 1
      - name: Sign up and sign in through the frontend proxy
        run: |
          base=http://localhost:8080/skillExchange/auth
          curl -sf -X POST "$base/signup" -H 'Content-Type: application/json' \
            -d '{"name":"CI User","email":"ci@example.test","password":"Ci-pass-123","role":"USER"}' > /dev/null
          curl -sf -X POST "$base/signin" -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.test","password":"Ci-pass-123"}' | grep -q '"token"'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Stop
        if: always()
        run: docker compose down -v

  build:
    needs: smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
