apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-uploads
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1   # uploads live on a ReadWriteOnce volume
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
      # Spring Boot exits if the database is unreachable at startup:
      # wait for MySQL instead of crash-looping.
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.37
          command: ["sh", "-c", "until nc -z mysql 3306; do echo waiting for mysql; sleep 3; done"]
          securityContext:
            runAsUser: 10001
            allowPrivilegeEscalation: false
      containers:
        - name: backend
          image: ghcr.io/onsgharbii/skillexchange-devops/backend:latest
          ports:
            - name: http
              containerPort: 8084
          envFrom:
            - secretRef:
                name: skillexchange-secrets
          env:
            - name: DB_URL
              value: jdbc:mysql://mysql:3306/skillexchange
            - name: FRONTEND_BASE_URL
              value: http://skillexchange.localtest.me
            - name: APP_BASE_URL
              value: http://skillexchange.localtest.me
          # No actuator in the upstream app: probe the TCP port.
          startupProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
            failureThreshold: 36   # up to 3 minutes (JVM start + DB schema update)
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: backend-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8084
      targetPort: http
