# Local stack: MySQL + Spring Boot API + Angular/NGINX frontend.
# Usage: cp .env.example .env && docker compose up --build
# App: http://localhost:8080

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: skillexchange
      MYSQL_USER: ${DB_USERNAME:-skillexchange}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    image: skillexchange-backend:local
    env_file: .env
    environment:
      DB_URL: jdbc:mysql://mysql:3306/skillexchange
    volumes:
      - uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    image: skillexchange-frontend:local
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql-data:
  uploads:
