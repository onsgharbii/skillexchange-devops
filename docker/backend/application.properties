# Replaces the upstream application.properties at image build time.
# Every value comes from an environment variable: no secret is baked into the image.
spring.application.name=SkillExchange
server.port=8084
server.servlet.context-path=/skillExchange
spring.main.allow-bean-definition-overriding=true
# Some integrations (e.g. PayPal) call their API when the bean is created.
# Lazy init creates them on first use, so the app starts with only the
# integrations you configure.
spring.main.lazy-initialization=${LAZY_INIT:true}

spring.datasource.url=${DB_URL:jdbc:mysql://mysql:3306/skillexchange?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:skillexchange}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
upload.directory=${UPLOAD_DIRECTORY:/app/uploads}

frontend.base.url=${FRONTEND_BASE_URL:http://localhost:8080}
app.base-url=${APP_BASE_URL:http://localhost:8080}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

stripe.secret.key=${STRIPE_SECRET_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
stripe.success.url=${FRONTEND_BASE_URL:http://localhost:8080}/success
stripe.cancel.url=${FRONTEND_BASE_URL:http://localhost:8080}/cancel
paypal.client.id=${PAYPAL_CLIENT_ID:}
paypal.client.secret=${PAYPAL_CLIENT_SECRET:}
paypal.mode=${PAYPAL_MODE:sandbox}

mixpanel.api.secret=${MIXPANEL_API_SECRET:}
openai.api.key=${OPENAI_API_KEY:}
huggingface.api.token=${HUGGINGFACE_API_TOKEN:}
huggingface.api.key=${HUGGINGFACE_API_KEY:}
huggingface.api.url=${HUGGINGFACE_API_URL:https://api-inference.huggingface.co}
clarifai.api.key=${CLARIFAI_API_KEY:}
youtube.api.key=${YOUTUBE_API_KEY:}
xai.api.key=${XAI_API_KEY:}
ollama.host=${OLLAMA_HOST:http://ollama:11434}
whatsapp.instance.id=${WHATSAPP_INSTANCE_ID:}
whatsapp.token=${WHATSAPP_TOKEN:}
whatsapp.phone.number=${WHATSAPP_PHONE_NUMBER:}
